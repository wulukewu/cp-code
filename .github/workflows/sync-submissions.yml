name: Sync submissions

on:
  schedule:
    - cron: "17 19 * * *" # 03:17 Asia/Taipei (UTC+8)
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Re-fetch all submission history
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/sync-submissions.yml"
      - "scripts/submissions/**"
      - "config/submission_accounts.json"

permissions:
  contents: write

concurrency:
  group: submission-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync submission metadata
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_refresh }}" == "true" ]]; then
            args+=(--full-refresh)
          fi
          python scripts/submissions/sync.py "${args[@]}"

      - name: Validate generated data
        run: python scripts/submissions/validate.py

      - name: Show generated summary
        run: cat data/submission-summary.json

      - name: Upload PR sync snapshot
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: submission-sync-snapshot
          path: data/
          retention-days: 1

      - name: Commit updated data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/submissions data/submission-summary.json)" ]]; then
            echo "No new submission data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/submissions data/submission-summary.json
          git commit -m "data: sync submissions"
          git push
